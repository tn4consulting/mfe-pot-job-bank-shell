# Overrides layered on top of values.yaml for a real AWS EKS deployment (see
# mfe-pot/docs/plans/20260808-1500-mfe-pot-aws-eks-terraform.md). See
# mfe-pot-job-bank-mfe/charts/job-bank-mfe/values-eks.yaml for the fuller
# explanatory comments this pattern was worked out against first.
#
# Like mfe-pot-msca-shell's values-eks.yaml, this rewrites `remotes` and
# `mockIdpBaseUrl` too -- both real public Ingress hostnames the citizen's
# own browser fetches directly, not in-cluster Service DNS.

frontend:
  # 2 replicas + a real PDB on EKS -- kind stays at 1 (values.yaml) to
  # limit resource pressure on a single-node dev cluster. See
  # mfe-pot/TODO.md's "Design principles" section, principles 3/4.
  replicaCount: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  image:
    repository: 147318891438.dkr.ecr.ca-central-1.amazonaws.com/mfe-pot-job-bank-shell
    pullPolicy: IfNotPresent
  runtimeConfig:
    strapiBaseUrl: "https://cms.aws.tn4consulting.com"
    mockIdpBaseUrl: "https://mock-idp.aws.tn4consulting.com"
    otelExporterOtlpEndpoint: "https://otel.aws.tn4consulting.com"
    remotes:
      job-bank-mfe: "https://job-bank-mfe.aws.tn4consulting.com/remoteEntry.json"

ingress:
  host: job-bank.aws.tn4consulting.com
  tls:
    enabled: true
    clusterIssuer: letsencrypt-prod
