apiVersion: v2
name: job-bank-shell
description: >-
  Deploys the job-bank-shell frontend as a Helm release, independent of
  every other mfe-pot app -- `helm upgrade --install job-bank-shell
  ./charts/job-bank-shell` touches only this. job-bank-shell has no
  co-located BFF (it's a pure federation host, composing only the job-bank
  remote), so like mfe-pot-msca-shell's chart this one depends only on
  mfe-frontend-lib, not mfe-backend-lib. Scaffolded from
  mfe-pot-msca-shell's chart as a second, minimal host app proving the
  federation pattern generalizes beyond one shell; its library-chart
  dependency still resolves from the platform repo's sibling checkout via
  a local relative path for now, and will move to a packaged/OCI registry
  reference once the library charts are pushed there.
type: application
version: 0.1.0
dependencies:
  - name: mfe-frontend-lib
    version: 0.1.0
    repository: "file://../../../mfe-pot-platform/charts/mfe-frontend-lib"
